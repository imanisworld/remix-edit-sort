name: safety-tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install mutagen numpy

      - name: Compile Python
        run: python -m compileall -q scripts tests

      # The structural gate. Discovers every mutation primitive in every
      # active module via the AST and requires each module carrying one to
      # declare which safety category it belongs to. This is what fails when
      # somebody adds a new uncontrolled mutation path -- unlike the old
      # hand-maintained grep over two specific filenames, it needs no upkeep
      # to cover a file that does not exist yet.
      - name: Mutation-surface gate
        run: python scripts/mutation_surface.py

      - name: Run safety tests
        run: python -m unittest discover -s tests -v

      - name: Prevent genre naming drift
        run: python scripts/check_genre_naming.py

      - name: Validate reusable evidence registry
        run: python scripts/validate_year_evidence.py references/year-evidence.json

      # Belt-and-braces alongside the AST scan: a plain-text check that the
      # read-only audit scripts have not grown a mutation call. Cheap, and it
      # fails even if the scanner itself is broken.
      - name: Audit code must not write audio metadata
        shell: bash
        run: |
          if grep -RInE '(^|[^A-Za-z])(delete|unlink|remove|rename|replace|move|rmtree|audio\.save|mutagen.*save)[[:space:]]*\(' scripts/audit_library.py scripts/run_verified_audit.py; then
            echo 'Forbidden source-mutation primitive found in read-only audit scripts.' >&2
            exit 1
          fi

      # handoff/ is historical evidence, never production executable code.
      - name: handoff must contain no executable Python
        shell: bash
        run: |
          if find handoff -name '*.py' | grep -q .; then
            echo 'handoff/ contains executable Python. Archive it as *.py.archived.' >&2
            find handoff -name '*.py' >&2
            exit 1
          fi

      # The retired P0 mutators must stay retired.
      - name: Retired mutators must not regain an apply path
        shell: bash
        run: |
          for script in scripts/standardize_names.py scripts/reclassify.py; do
            if ! grep -q 'RETIRED_MUTATION_MESSAGE' "$script"; then
              echo "$script lost its retirement guard." >&2
              exit 1
            fi
          done
          for script in scripts/apply_plan.py scripts/merge_events_duplicates.py; do
            if ! grep -q 'MUTATION_DISABLED' "$script"; then
              echo "$script lost its hard-disable guard." >&2
              exit 1
            fi
          done

      # Only an identical SHA-256 may ever be called a duplicate.
      - name: No filename or duration heuristic may claim a duplicate
        shell: bash
        run: |
          if grep -RIn 'bucket"\] = "duplicate"' scripts/; then
            echo 'A script is still labelling a name/duration collision a duplicate.' >&2
            exit 1
          fi

  # macOS is where the library actually lives. CI on Linux cannot prove APFS
  # case-insensitivity or Unicode normalization behavior, so run the suite on
  # a Mac runner too. This is NOT a substitute for the pre-apply Mac canary
  # against the real volume -- see MAC-CANARY.md.
  macos-behavior:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install mutagen numpy
      - name: Run the filesystem-behavior suite on macOS
        run: python -m unittest discover -s tests -v
